<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>GracePath Academy</title>


<style>

body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:#f4f6f9;

}


header{

background:#0b2d5c;

color:white;

padding:30px;

text-align:center;

}



.container{

max-width:1200px;

margin:auto;

padding:30px;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}



.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

text-align:center;

}



.icon{

font-size:60px;

}



.card h2{

margin-top:15px;

color:#0b2d5c;

}



.card p{

line-height:1.7;

color:#555;

}



button{

padding:12px 25px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:15px;

margin-top:15px;

}



.enroll{

background:#16a34a;

color:white;

}



.continue{

background:#2563eb;

color:white;

}



.back{

background:#e5e7eb;

color:black;

}



button:hover{

opacity:.9;

}



</style>

</head>

<body>



<header>

<h1>

📚 GracePath Academy

</h1>


<p>

Choose a learning pathway

</p>



<button

class="back"

onclick="location.href='profile.html'">

← My Profile

</button>



</header>





<div class="container">


<div class="grid">





<div class="card">


<div class="icon">

👶

</div>



<h2>

Faith Starter Series

</h2>



<p>

Bible lessons for children ages 4–12.

</p>



<button

class="continue"

onclick="openProgram(

'faith-starters'

)">

Open Program

</button>



</div>







<div class="card">


<div class="icon">

🌱

</div>



<h2>

Firm Foundations

</h2>



<p>

Rooted • Build • Established • Sent

</p>



<button

class="continue"

onclick="openProgram(

'firm-foundation'

)">

Open Program

</button>



</div>








<div class="card">


<div class="icon">

📖

</div>



<h2>

Discipleship Class

</h2>



<p>

Biblical foundations for every believer.

</p>



<button

class="continue"

onclick="openProgram(

'discipleship'

)">

Open Program

</button>



</div>








<div class="card">


<div class="icon">

👑

</div>



<h2>

Mentorship

</h2>



<p>

Leadership and ministry development.

</p>



<button

class="continue"

onclick="openProgram(

'mentorship'

)">

Open Program

</button>



</div>




</div>

</div>






<script>



function openProgram(folder){



const member =

localStorage.getItem(

"currentMemberId"

);



if(!member){


alert(

"Please access your profile first."

);


location.href=

"profile.html";


return;


}



localStorage.setItem(

"selectedProgram",

folder

);



location.href=

folder+

"/index.html";



}



</script>




</body>

</html>
