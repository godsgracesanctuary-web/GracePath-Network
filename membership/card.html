<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GracePath Membership Card</title>

<style>

body{

margin:0;
padding:40px;
background:#eef4ff;
font-family:Arial,Helvetica,sans-serif;

display:flex;
flex-direction:column;
align-items:center;

}


.card{

width:540px;
height:320px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 5px 20px rgba(0,0,0,.15);

border:3px solid #3b82f6;

}


.top{

height:110px;

background:linear-gradient(
135deg,
#081c5e,
#2563eb
);

display:flex;

justify-content:center;

align-items:center;

gap:35px;

}


.logo{

width:80px;
height:80px;

border-radius:50%;

object-fit:cover;

border:4px solid white;

}


.photo{

width:80px;
height:80px;

border-radius:50%;

object-fit:cover;

border:4px solid #22c55e;

}


.middle{

padding:15px 25px;

text-align:center;

}


.name{

font-size:28px;

font-weight:bold;

margin:0;

}


.memberid{

font-size:24px;

font-weight:bold;

color:#2563eb;

margin-top:5px;

}



.bottom{

display:flex;

justify-content:space-between;

padding:0 25px;

}



.details{

font-size:18px;

line-height:2;

}



.details td{

padding-right:15px;

}



.qr img{

width:110px;

}



.footer{

text-align:center;

font-size:12px;

color:#666;

margin-top:5px;

}



button{

margin-top:20px;

padding:12px 30px;

border:none;

border-radius:8px;

background:#2563eb;

color:white;

font-size:16px;

cursor:pointer;

}


@media print{


button{

display:none;

}


body{

background:white;

padding:0;

}


.card{

box-shadow:none;

}


}


</style>

</head>

<body>



<div class="card">



<div class="top">


<img src="cardlogo.png" class="logo">


<img id="photo"
class="photo">


</div>




<div class="middle">


<h1 class="name"
id="name">
Loading...
</h1>


<div class="memberid"
id="memberid">
</div>


</div>




<div class="bottom">


<div class="details">


<table>


<tr>

<td><b>Level</b></td>

<td id="level"></td>

</tr>



<tr>

<td><b>Status</b></td>

<td id="status"></td>

</tr>



<tr>

<td><b>Region</b></td>

<td id="region"></td>

</tr>



<tr>

<td><b>Joined</b></td>

<td id="joined"></td>

</tr>


</table>


</div>



<div class="qr">

<img id="qr">

</div>


</div>




<div class="footer">


GracePath Family


<br>


Growing in Christ • Walking in Grace • Impacting Lives


<br>


www.gracepathnetwork.org


</div>



</div>



<button onclick="window.print()">


🖨 Print Card


</button>




<script type="module">


import {initializeApp}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

doc,

getDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig={

apiKey:"YOUR_KEY",

authDomain:"gods-grace-sanctuary-7c3e9.firebaseapp.com",

projectId:"gods-grace-sanctuary-7c3e9",

storageBucket:"gods-grace-sanctuary-7c3e9.firebasestorage.app",

messagingSenderId:"794689665126",

appId:"YOUR_APP_ID"

};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);



const id=

localStorage.getItem(

"currentMemberDocId"

);



const snap=

await getDoc(

doc(

db,

"members",

id

)

);



const m=snap.data();



document.getElementById("name").textContent=
m.fullName||"";


document.getElementById("memberid").textContent=
m.memberId||"";


document.getElementById("level").textContent=
m.membershipLevel||"Member";


document.getElementById("status").textContent=
m.status||"Active";


document.getElementById("region").textContent=
m.region||"-";


document.getElementById("joined").textContent=
m.joinedDate||"-";


document.getElementById("photo").src=

m.photoURL ||

"https://ui-avatars.com/api/?name="+

encodeURIComponent(

m.fullName

);



const verify=

`${window.location.origin}/membership/verify.html?id=${id}`;



document.getElementById("qr").src=

`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(verify)}`;


</script>


</body>
</html>
