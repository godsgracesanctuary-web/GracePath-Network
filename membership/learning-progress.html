<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Learning Progress</title>

<style>

body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:#f4f6f9;

}


header{

background:#0b2d5c;

padding:25px;

text-align:center;

color:white;

}


.container{

max-width:1100px;

margin:auto;

padding:30px;

}


.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}


.card{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

text-align:center;

}


.big{

font-size:32px;

font-weight:bold;

color:#16a34a;

}


.course{

background:white;

padding:25px;

margin-bottom:25px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

}


.progress{

height:25px;

background:#ddd;

border-radius:20px;

overflow:hidden;

margin-top:10px;

}


.progress-fill{

height:25px;

background:#16a34a;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-weight:bold;

}


.badge{

padding:6px 12px;

border-radius:20px;

font-size:14px;

display:inline-block;

margin-top:15px;

}


.active{

background:#dcfce7;

color:#15803d;

}


.completed{

background:#dbeafe;

color:#1d4ed8;

}


.pending{

background:#fee2e2;

color:#dc2626;

}


button{

padding:12px 20px;

background:#0b2d5c;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

</style>

</head>

<body>



<header>

<h1>

📚 Learning Progress

</h1>

<p>

GracePath Academy

</p>

</header>



<div class="container">


<div class="stats">


<div class="card">

<h3>

Programs

</h3>

<p class="big" id="programs">

0

</p>

</div>



<div class="card">

<h3>

Lessons Completed

</h3>

<p class="big" id="lessons">

0

</p>

</div>



<div class="card">

<h3>

Average Progress

</h3>

<p class="big" id="average">

0%

</p>

</div>



<div class="card">

<h3>

Certificates

</h3>

<p class="big" id="certificates">

0

</p>

</div>


</div>



<div id="courses">

Loading...

</div>



<br>

<button onclick="history.back()">

← Back

</button>


</div>




<script type="module">

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

query,

where,

getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig={

apiKey:"YOUR API",

authDomain:"YOUR DOMAIN",

projectId:"gods-grace-sanctuary-7c3e9",

storageBucket:"",

messagingSenderId:"",

appId:""

};



const app=

initializeApp(

firebaseConfig

);


const db=

getFirestore(

app

);



const memberId=

localStorage.getItem(

"currentMemberId"

);



const courses=

document.getElementById(

"courses"

);



if(!memberId){

courses.innerHTML=

"<h2>Please login first.</h2>";

}


else{


const q=

query(

collection(

db,

"memberCourses"

),

where(

"memberId",

"==",

memberId

)

);



const snap=

await getDocs(

q

);



courses.innerHTML="";


let totalLessons=0;

let totalProgress=0;

let totalCertificates=0;

let count=0;



snap.forEach(doc=>{


const c=

doc.data();



count++;



totalLessons+=

Number(

c.lessonsCompleted||0

);



totalProgress+=

Number(

c.progress||0

);



if(

c.certificateAwarded

)

totalCertificates++;



let badge="active";



if(

c.status=="Completed"

)

badge="completed";



if(

c.status=="Pending"

)

badge="pending";



courses.innerHTML+=`

<div class="course">


<h2>

${c.program}

</h2>



<p>

Level :

${c.level}

</p>



<p>

Completed :

${c.lessonsCompleted}

/

${c.totalLessons}

</p>



<div class="progress">


<div class="progress-fill"

style="width:${c.progress}%;">


${c.progress}%


</div>


</div>



<div class="badge ${badge}">

${c.status}

</div>



</div>

`;


});



document.getElementById(

"programs"

)

.innerHTML=

count;



document.getElementById(

"lessons"

)

.innerHTML=

totalLessons;



document.getElementById(

"average"

)

.innerHTML=

Math.round(

totalProgress/count

)

+

"%";



document.getElementById(

"certificates"

)

.innerHTML=

totalCertificates;



}


</script>

</body>
</html>
