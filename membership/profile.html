<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>My Profile | GracePath Family</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
}

header{
background:#0b2d5c;
color:white;
padding:40px 20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.profile-row{
padding:10px 0;
border-bottom:1px solid #eee;
}

.profile-label{
font-weight:bold;
}

.profile-photo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #16a34a;
}

#profileSection{
display:none;
}

.message{
margin-top:10px;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>👤 My Profile</h1>

<p>
GracePath Family Member Portal
</p>

</header>


<div class="container">



<div class="card">

<h2>Access My Profile</h2>


<input
id="membershipNumber"
placeholder="Membership Number">


<input
id="phone"
placeholder="Registered Phone Number">


<button onclick="findMember()">

Access My Profile

</button>


<p class="message"
id="message"></p>


</div>




<div class="card"

id="profileSection">



<div style="text-align:center;">


<img

id="photo"

class="profile-photo"


src="https://ui-avatars.com/api/?name=Member">



<h2 id="displayName"></h2>

<p id="displayLevel"></p>

</div>



<div class="profile-row">

<span class="profile-label">

Email:

</span>

<span id="displayEmail"></span>

</div>



<div class="profile-row">

<span class="profile-label">

Phone:

</span>

<span id="displayPhone"></span>

</div>



<div class="profile-row">

<span class="profile-label">

Region:

</span>

<span id="displayRegion"></span>

</div>



<div class="profile-row">

<span class="profile-label">

Membership Number:

</span>

<span id="displayMembershipNumber"></span>

</div>




<div style="margin-top:25px;">



<button onclick="openCard()">

🪪 Membership Card

</button>



<button

onclick="location.href='my-certificates.html'">

🏆 Certificates

</button>



<button

onclick="location.href='learning-progress.html'">

📚 Learning Progress

</button>



</div>



</div>


</div>



<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,

collection,

query,

where,

getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig={

apiKey:"AIzaSyDam-sUomXTNWvsjVwen8fHHChyEeM5a5c",

authDomain:"gods-grace-sanctuary-7c3e9.firebaseapp.com",

projectId:"gods-grace-sanctuary-7c3e9",

storageBucket:"gods-grace-sanctuary-7c3e9.firebasestorage.app",

messagingSenderId:"794689665126",

appId:"1:794689665126:web:a593f7831c0e161a9b15a7"

};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);



window.findMember=async function(){



const membershipNumber=

document.getElementById(

"membershipNumber"

)

.value

.trim()

.toUpperCase();



const phone=

document.getElementById(

"phone"

)

.value

.replace(/\D/g,'');



const message=

document.getElementById(

"message"

);



message.textContent="";



try{


const q=query(

collection(db,"members"),

where(

"memberId",

"==",

membershipNumber

)

);



const snap=

await getDocs(q);



if(snap.empty){

message.style.color="red";

message.textContent=

"Member ID not found.";

return;

}



let found=false;



snap.forEach((doc)=>{


const m=doc.data();



const storedPhone=

(m.phone||"")

.replace(/\D/g,'');



if(

storedPhone===phone

){


found=true;



localStorage.setItem(

"currentMemberDocId",

doc.id

);



localStorage.setItem(

"currentMemberId",

m.memberId

);




document.getElementById(

"profileSection"

)

.style.display="block";




document.getElementById(

"displayName"

)

.textContent=

m.fullName||"";



document.getElementById(

"displayEmail"

)

.textContent=

m.email||"";



document.getElementById(

"displayPhone"

)

.textContent=

m.phone||"";



document.getElementById(

"displayRegion"

)

.textContent=

m.region||"";



document.getElementById(

"displayMembershipNumber"

)

.textContent=

m.memberId||"";



document.getElementById(

"displayLevel"

)

.textContent=

m.membershipLevel||

"Member";



document.getElementById(

"photo"

)

.src=

m.photoURL ||

"https://ui-avatars.com/api/?name="+

encodeURIComponent(

m.fullName

);




message.style.color=

"green";


message.textContent=

"Profile loaded successfully.";


}


});




if(!found){

message.style.color=

"red";

message.textContent=

"Phone number does not match.";

}



}


catch(error){


console.error(error);


message.style.color=

"red";


message.textContent=

"Unable to load profile.";


}


};



window.openCard=function(){


location.href=

"membership/card.html";


};


</script>


</body>

</html>
