o:["Recognition","Success","Glorifying God","Expansion"],
a:2
}

],

};
const lesson=

new URLSearchParams(

window.location.search

)

.get(

"lesson"

);




const exam=

exams[lesson];



document.getElementById(

"title"

)

.innerHTML=

lesson.toUpperCase()

+

" EXAM";




const qBox=

document.getElementById(

"questions"

);



exam.forEach(

(q,i)=>{


let html=`

<div class='question'>

<h3>

${i+1}.

${q.q}

</h3>

`;



q.o.forEach(

(opt,j)=>{


html+=`

<label>

<input

type='radio'

name='q${i}'

value='${j}'>

${opt}

</label>

`;



});



html+=`

</div>

`;



qBox.innerHTML+=

html;



});




async function gradeExam(){


let score=0;


exam.forEach((q,i)=>{


const s=

document.querySelector(

`input[name=q${i}]:checked`

);


if(

s &&

parseInt(s.value)==q.a

){

score++;

}


});


const percent=

Math.round(

(score/exam.length)*100

);


const result=

document.getElementById(

"result"

);



if(percent>=70){


result.className=

"pass";


result.innerHTML=

"✅ PASSED"

+

"<br>"

+

"Score : "

+

percent

+

"%"

+

"<br>"

+

"Certificate Eligible";



localStorage.setItem(

lesson+"_score",

percent

);


localStorage.setItem(

lesson+"_status",

"Passed"

);



await saveExam(

percent

);


await updateProgress();


}else{


result.className=

"fail";


result.innerHTML=

"❌ FAILED"

+

"<br>"

+

"Score : "

+

percent

+

"%"

+

"<br>"

+

"Please Retake Exam";



localStorage.setItem(

lesson+"_score",

percent

);


localStorage.setItem(

lesson+"_status",

"Failed"

);


}


}




async function saveExam(score){


await addDoc(

collection(

db,

"examResults"

),

{

memberId:

localStorage.getItem(

"currentMemberId"

),


lesson:

lesson,


score:

score,


passed:true,


dateTaken:

new Date()


}

);


}





async function updateProgress(){

const examKey = lesson+"_completed";

if(localStorage.getItem(examKey)){

return;

}


const memberId=

localStorage.getItem(

"currentMemberId"

);


const q=query(

collection(db,"memberCourses"),

where("memberId","==",memberId)

);


const snap=await getDocs(q);


snap.forEach(async(d)=>{


const c=d.data();


let completed=

Number(

c.lessonsCompleted||0

);


completed++;


let progress=

Math.round(

(completed/

c.totalLessons)

*100

);


let status="In Progress";

let certificate=false;


if(progress>=100){

progress=100;

status="Completed";

certificate=true;

}


await updateDoc(

doc(

db,

"memberCourses",

d.id

),

{

lessonsCompleted:completed,

progress:progress,

status:status,

certificateAwarded:certificate

}

);


localStorage.setItem(

examKey,

"yes"

);


});


}


let time = 1800;

setInterval(() => {

let m = Math.floor(time/60);

let s = time % 60;


document.getElementById("timer").innerHTML =

String(m).padStart(2,'0')

+

":"

+

String(s).padStart(2,'0');


time--;


if(time < 0){

gradeExam();

}

},1000);

</script>
