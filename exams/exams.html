<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>GracePath Exam</title>

<style>

body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:#f4f6f9;

}


header{

background:#0b2d5c;

padding:25px;

text-align:center;

color:white;

}


.container{

max-width:900px;

margin:auto;

padding:30px;

}


.question{

background:white;

padding:25px;

margin-bottom:20px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

}


.question h3{

margin-top:0;

color:#0b2d5c;

}


label{

display:block;

padding:8px 0;

cursor:pointer;

}


button{

padding:14px 25px;

border:none;

border-radius:8px;

background:#0f766e;

color:white;

font-size:16px;

cursor:pointer;

margin-right:10px;

}


button:hover{

background:#115e59;

}


#result{

margin-top:30px;

font-size:26px;

font-weight:bold;

text-align:center;

}


.pass{

color:green;

}


.fail{

color:red;

}


</style>

</head>

<body>


<header>

<h1>

GracePath Academy Examination

</h1>

</header>



<div class="container">


<h2 id="examTitle">

Loading Exam...

</h2>



<div id="questions">

</div>



<button onclick="gradeExam()">

Submit Exam

</button>


<button onclick="location.reload()">

Retake

</button>



<div id="result">

</div>


</div>




<script>



const exams={


stewardship:[


{

q:"Who owns everything?",

options:[

"Man",

"Church",

"God",

"Pastor"

],

answer:2

},



{

q:"Stewardship means?",

options:[

"Wasting",

"Faithful Management",

"Ownership",

"Business"

],

answer:1

},



{

q:"Matthew 25 teaches about?",

options:[

"Marriage",

"Talents",

"Flood",

"Prayer"

],

answer:1

}



],





foundation:[



{

q:"Salvation comes through?",

options:[

"Works",

"Grace",

"Money",

"Law"

],

answer:1

},



{

q:"Jesus Christ is?",

options:[

"Teacher",

"Angel",

"Saviour",

"King David"

],

answer:2

},



{

q:"The Bible is?",

options:[

"Novel",

"Magazine",

"Word of God",

"Story Book"

],

answer:2

}



]



};




const params=

new URLSearchParams(

window.location.search

);


const lesson=

params.get(

"lesson"

);



const exam=

exams[lesson];



if(!exam){


document.getElementById(

"examTitle"

)

.innerHTML=


"Exam Not Found";


throw new Error(

"Exam not found"

);


}




document.getElementById(

"examTitle"

)

.innerHTML=


lesson.toUpperCase()

+

" EXAM";




const container=

document.getElementById(

"questions"

);




exam.forEach(

(q,index)=>{


let html=`

<div class="question">

<h3>

${index+1}.

${q.q}

</h3>

`;



q.options.forEach(

(opt,i)=>{


html+=`

<label>

<input

type="radio"

name="q${index}"

value="${i}">

${opt}

</label>

`;


});


html+=`

</div>

`;



container.innerHTML+=

html;



});





function gradeExam(){


let score=0;



exam.forEach(

(q,index)=>{


const selected=

document.querySelector(

`input[name=q${index}]:checked`

);



if(

selected &&

parseInt(

selected.value

)==q.answer

){

score++;

}


});




const percent=

Math.round(

score/

exam.length

*100

);



const result=

document.getElementById(

"result"

);




if(percent>=70){


result.className=

"pass";


result.innerHTML=


"✅ PASSED"

+

"<br>"

+

percent

+

"%";


}else{


result.className=

"fail";


result.innerHTML=


"❌ FAILED"

+

"<br>"

+

percent

+

"%";


}



}



</script>


</body>

</html>
