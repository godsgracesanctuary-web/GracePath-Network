<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Daily Devotional | GracePath Network
</title>

<link rel="stylesheet" href="../style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:Arial,Helvetica,sans-serif;

background:#f4f7fb;

color:#333;

line-height:1.6;

}



/* HERO */

.hero{

background:linear-gradient(135deg,#0b2d5c,#163f86);

padding:70px 20px;

text-align:center;

color:white;

}


.hero h1{

font-size:42px;

margin-bottom:15px;

}


.hero p{

max-width:750px;

margin:auto;

font-size:18px;

}



/* NAVIGATION */

nav{

background:white;

padding:15px 8%;

box-shadow:0 2px 5px rgba(0,0,0,.1);

}


nav a{

text-decoration:none;

font-weight:bold;

color:#0b2d5c;

}



/* SEARCH */

.search{

padding:40px 20px;

text-align:center;

}


.search input{


width:100%;

max-width:650px;

padding:15px 25px;

border-radius:40px;

border:1px solid #ddd;

outline:none;

font-size:16px;

}



.count{

text-align:center;

color:#666;

margin-bottom:30px;

}



/* CARDS */


.cards{


display:grid;


grid-template-columns:

repeat(auto-fit,minmax(260px,1fr));


gap:25px;


padding:0 8% 60px;


}




.card{


background:white;


padding:25px;


border-radius:18px;


box-shadow:

0 4px 12px rgba(0,0,0,.08);


transition:.3s;


text-align:center;


}



.card:hover{


transform:translateY(-5px);


}



.card h3{


min-height:60px;


color:#0b2d5c;


margin-bottom:25px;


}



.card a{


display:inline-block;


padding:12px 28px;


border-radius:30px;


background:#0b2d5c;


color:white;


text-decoration:none;


font-weight:bold;


}



.card a:hover{


background:#163f86;


}




footer{


background:#081f4d;


padding:40px;


text-align:center;


color:white;


}



footer p{


margin:8px 0;


}




@media(max-width:768px){


.hero h1{


font-size:32px;


}


.cards{


padding:0 20px 50px;


}


}


</style>

</head>

<body>




<section class="hero">


<h1>

Daily Devotional

</h1>



<p>

Daily devotionals, prayers,
prophetic encouragement,
and biblical reflections
to strengthen your walk with God.

</p>



</section>




<nav>


<a href="../index.html">

← Back Home

</a>


</nav>




<div class="search">


<input

type="text"

id="search"

placeholder="Search devotional...">


</div>



<p class="count"

id="total">

</p>




<div class="cards"

id="devotions">

</div>





<footer>


<p>

GracePath Network

</p>



<p>

Growing in Christ • Walking in Grace • Impacting Lives

</p>



<p>

gracepathnetwork@gmail.com

</p>



<p>

+254 721 335 631

</p>


</footer>





<script>




const devotionals=[

["God Is Preparing You for More",

"Lessons/God Is Preparing You for More.pdf"],



["God Will Surprise You with His Goodness",

"Lessons/God Will Surprise You with His Goodness.pdf"],



["When You Have Done All, Stand",

"Lessons/When You Have Done All, Stand.pdf"],



["The Lord Will Perfect What Concerns You",

"Lessons/The Lord Will Perfect What Concerns You.pdf"],


["God Is Never Late",

"Lessons/God Is Never Late.pdf"],



["Bloom Where God Has Planted You",

"Lessons/Bloom Where God Has Planted You.pdf"],



["Live One Day at a Time",

"Lessons/Live One Day at a Time.pdf"],



["Your Season Will Change",

"Lessons/Your Season Will Change.pdf"],


["God's Mercy is New Today",

"Lessons/God's Mercy is New Today.pdf"],



["The Battle Belongs to the Lord",

"Lessons/The Battle Belongs to the Lord.pdf"],



["Don't Give Up—God Is Working",

"Lessons/Don't Give Up—God Is Working.pdf"],



["God Will Guide Your Steps",

"Lessons/God Will Guide Your Steps.pdf"],



["Be Strong and Courageous",

"Lessons/Be Strong and Courageous.pdf"],



["Do Not Be Afraid",

"Lessons/Do Not Be Afraid.pdf"],



["God Has Not Forgotten You",

"Lessons/GOD HAS NOT FORGOTTEN YOU.pdf"],



["God Is Working for Your Good",

"Lessons/God is Working for Your Good.pdf"],



["God Is Your Strength",

"Lessons/GOD IS YOUR STRENGTH.pdf"],



["God Makes All Things New",

"Lessons/God Makes All Things New.pdf"],



["God Sees Your Faithfulness",

"Lessons/God Sees Your Faithfulness.pdf"],



["God Will Give You Peace",

"Lessons/God Will Give You Peace.pdf"],



["God's Mercies",

"Lessons/God's Mercies.pdf"],



["God's Promises Never Fail",

"Lessons/God's Promises Never Fail.pdf"],



["Hold On to Hope",

"Lessons/Hold On to Hope.pdf"],



["KEEP YOUR EYES ON JESUS",

"Lessons/KEEP YOUR EYES ON JESUS.pdf"],



["Keep Moving Forward",

"Lessons/Keep Moving Forward.pdf"],



["Morning Prayer",

"Lessons/Morning Prayer.pdf"],



["Prophetic Declaration",

"Lessons/Prophetic Declaration.pdf"],



["Shine Where God Has Placed You",

"Lessons/Shine Where God Has Placed You.pdf"],



["Stay Close to God",

"Lessons/Stay Close to God.pdf"],



["The Lord Is Your Shepherd",

"Lessons/The Lord Is Your Shepherd.pdf"],



["The Lord Will Fight for You",

"Lessons/The Lord Will Fight for You.pdf"],



["Trust God In Every Season",

"Lessons/TRUST GOD IN EVERY SEASON.pdf"],



["Wait On The Lord",

"Lessons/Wait On The Lord.pdf"],



["Walk by Faith",

"Lessons/Walk by Faith.pdf"],



["Your Breakthrough Is Closer Than You Think",

"Lessons/Your Breakthrough Is Closer Than You Think.pdf"]



].sort();





const box=

document.getElementById("devotions");



const total=

document.getElementById("total");




function render(list){


box.innerHTML="";



total.innerHTML=


list.length+

" devotionals available";




list.forEach(item=>{


box.innerHTML+=`



<div class="card">


<h3>

${item[0]}

</h3>



<a href="${item[1]}"

target="_blank">


Open Devotion


</a>



</div>



`;



});


}



render(devotionals);





document

.getElementById("search")

.addEventListener(

"keyup",

function(){



let term=


this.value.toLowerCase();




let filtered=


devotionals.filter(


d=>d[0]

.toLowerCase()

.includes(term)

);



render(filtered);



});




</script>



</body>

</html>
