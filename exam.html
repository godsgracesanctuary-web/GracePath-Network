<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>GracePath Exam</title>

<style>

body{

font-family:Arial,Helvetica,sans-serif;

background:#f4f6f9;

margin:0;

padding:30px;

}


.container{

max-width:900px;

margin:auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 3px 15px rgba(0,0,0,.1);

}


h1{

text-align:center;

color:#0b2d5c;

}


.question{

margin-top:25px;

padding:20px;

background:#f8fafc;

border-left:5px solid #2563eb;

border-radius:8px;

}


.question p{

font-weight:bold;

}


label{

display:block;

padding:6px 0;

cursor:pointer;

}


button{

margin-top:30px;

padding:14px 30px;

border:none;

border-radius:8px;

background:#2563eb;

color:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#1d4ed8;

}


#result{

margin-top:30px;

font-size:22px;

font-weight:bold;

text-align:center;

}


.pass{

color:green;

}


.fail{

color:red;

}

</style>

</head>


<body>


<div class="container">


<h1>

Firm Foundations Exam

</h1>



<div class="question">

<p>

1. Salvation is received by?

</p>


<label>

<input type="radio"

name="q1"

value="A">

Good Works

</label>


<label>

<input type="radio"

name="q1"

value="B">

Grace through Faith

</label>


<label>

<input type="radio"

name="q1"

value="C">

Church Membership

</label>


<label>

<input type="radio"

name="q1"

value="D">

Water Baptism

</label>


</div>




<div class="question">

<p>

2. Which book contains John 3:16?

</p>


<label>

<input type="radio"

name="q2"

value="A">

Matthew

</label>


<label>

<input type="radio"

name="q2"

value="B">

Luke

</label>


<label>

<input type="radio"

name="q2"

value="C">

John

</label>


<label>

<input type="radio"

name="q2"

value="D">

Acts

</label>


</div>




<div class="question">

<p>

3. Prayer is primarily?

</p>


<label>

<input type="radio"

name="q3"

value="A">

Talking with God

</label>


<label>

<input type="radio"

name="q3"

value="B">

Reading Newspapers

</label>


<label>

<input type="radio"

name="q3"

value="C">

Entertainment

</label>


<label>

<input type="radio"

name="q3"

value="D">

Debating Others

</label>


</div>




<button

onclick="submitExam()">

Submit Exam

</button>



<div id="result">

</div>



</div>



<script>



function submitExam(){


let score=0;



if(

document.querySelector(

'input[name="q1"]:checked'

)?.value=="B"

)

score++;



if(

document.querySelector(

'input[name="q2"]:checked'

)?.value=="C"

)

score++;



if(

document.querySelector(

'input[name="q3"]:checked'

)?.value=="A"

)

score++;




let percent=

(score/3)*100;



const result=

document.getElementById(

"result"

);



if(percent>=70){


result.className=

"pass";


result.innerHTML=


"✅ PASSED<br>Score : "


+percent+

"%";


}else{


result.className=

"fail";


result.innerHTML=


"❌ FAILED<br>Score : "


+percent+

"%";


}



}



</script>



</body>

</html>
